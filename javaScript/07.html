<!DOCTYPE html>
<html>
<body>

<script>

let palavra = prompt("Digite uma palavra:");

let palavras = [];

for (let i = 0; i < 5; i++) {

    let letras = palavra.split("");

    letras.reverse();

    let primeira = letras.shift();

    letras.push(primeira);

    palavra = letras.join("");

    palavras.push(palavra);

}

alert(palavras.join("\n"));

</script>

</body>
</html>
