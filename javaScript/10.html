<!DOCTYPE html>
<html>
<body>

<script>

let nome = prompt("Digite o seu nome:");

let vogais = "aeiouáéíóú";
let quantidade = 0;

let resultado = "";

for (let letra of nome) {

    if (vogais.includes(letra.toLowerCase())) {

        quantidade++;

        resultado += "<u>" + letra + "</u>";

    } else {

        resultado += letra;

    }

}

document.write("Nome: " + resultado);

document.write("<br>Quantidade de vogais: " + quantidade);

</script>

</body>
</html>
