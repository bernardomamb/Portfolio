<!DOCTYPE html>
<html>
<body>

<script>

let pares = [];
let impares = [];

for (let i = 0; i < 5; i++) {

    let n = Number(prompt("Digite um número:"));

    if (n % 2 === 0) {
        pares.push(n);
    } else {
        impares.push(n);
    }

}

alert("Pares: " + pares +
      "\nÍmpares: " + impares);

</script>

</body>
</html>
