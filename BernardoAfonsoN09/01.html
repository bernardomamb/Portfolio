<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  /* Deixa o cartão no centro da tela */
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
  }

  /* O cartão em si */
  .cartao {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
    padding: 24px;
    width: 350px;
    text-align: center;
    display: flex;
    flex-direction: column; /* tudo um embaixo do outro */
    gap: 16px; /* espaço entre cada item */
  }

  /* Avatar redondo */
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(#f0f0f0, #d9d9d9);
    margin: 0 auto; /* centraliza */
  }

  .nome { font-weight: bold; font-size: 18px; margin: 0; }
  .bio { color: #666; font-size: 15px; margin: 0; }

  /* Linha dos botões */
  .botoes {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid #ddd;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-preto { background: #111; color: white; border-color: #111; }
  .btn-branco { background: white; color: #111; }

  /* Linha dos números embaixo */
  .stats {
    display: flex;
    justify-content: space-between; /* joga um pra cada lado */
    border-top: 1px solid #eee;
    padding-top: 16px;
  }
  .stats strong { display: block; font-size: 18px; }
  .stats span { font-size: 13px; color: #777; }
</style>
</head>
<body>

<div class="cartao">
  <div class="avatar"></div>
  <h2 class="nome">Marta Fernandes</h2>
  <p class="bio">Designer e professora de HTML e CSS.</p>

  <div class="botoes">
    <button class="btn btn-preto">Seguir</button>
    <button class="btn btn-branco">Mensagem</button>
  </div>

  <div class="stats">
    <div><strong>1,2 mil</strong><span>Seguidores</span></div>
    <div><strong>340</strong><span>A seguir</span></div>
    <div><strong>86</strong><span>Publicações</span></div>
  </div>
</div>

</body>
</html>
