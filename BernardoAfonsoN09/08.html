<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 20px; background: #f9f9f9; }
  h2 { margin: 0 0 4px 0; }
  .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
  .caixa { background: white; border: 1px solid #e5e5e5; border-radius: 16px; padding: 18px; margin-bottom: 16px; max-width: 500px; }
  .caixa strong { display: block; margin-bottom: 14px; }

  /* 1 - SPINNER */
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid #eee;
    border-top-color: #111; /* só a parte de cima é preta */
    border-radius: 50%;
    animation: girar 0.8s linear infinite;
  }
  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  /* 2 - ESQUELETO COM BRILHO */
  .linha { height: 14px; background: #eee; border-radius: 20px; margin-bottom: 12px; }
  .bloco { height: 80px; background: #eee; border-radius: 10px; margin-bottom: 12px; }
  .linha-pequena { width: 60%; }
  
  /* o brilho que passa */
  .shimmer {
    background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
    background-size: 200% 100%;
    animation: brilho 1.5s infinite;
  }
  @keyframes brilho {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* 3 - BOLINHA QUE PULSA */
  .notif {
    width: 14px;
    height: 14px;
    background: #e11;
    border-radius: 50%;
    position: relative;
  }
  .notif::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #e11;
    animation: pulso 1.5s infinite;
  }
  @keyframes pulso {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(2.5); opacity: 0; }
  }
</style>
</head>
<body>

<h2>Animações de carregamento</h2>
<p class="sub">Um spinner, um esqueleto com brilho e uma bolinha que pulsa.</p>

<div class="caixa">
  <strong>Spinner</strong>
  <div class="spinner"></div>
</div>

<div class="caixa">
  <strong>Esqueleto</strong>
  <div class="bloco shimmer"></div>
  <div class="linha shimmer"></div>
  <div class="linha linha-pequena shimmer"></div>
</div>

<div class="caixa">
  <strong>Notificação</strong>
  <div class="notif"></div>
</div>

</body>
</html>
