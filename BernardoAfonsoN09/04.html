<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  h2 { margin: 0 0 4px 0; }
  p.sub { color: #777; margin: 0 0 20px 0; }

  /* O CATÁLOGO MÁGICO */
  .catalogo {
    display: grid;
    /* A linha que faz tudo se ajustar sozinho */
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
  }

  .cartao {
    background: white;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 14px;
  }

  .imagem {
    background: linear-gradient(#eee, #ccc);
    border-radius: 10px;
    height: 120px;
    overflow: hidden;
  }
  .imagem img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .nome { font-weight: bold; margin: 12px 0 4px 0; }
  .preco { color: #777; margin: 0; }
</style>
</head>
<body>

<h2>Catálogo que se ajusta sozinho</h2>
<p class="sub">Redimensiona a janela: os cartões reorganizam-se sem media queries.</p>

<div class="catalogo">
  <div class="cartao">
    <div class="imagem"><img src="https://picsum.photos/300/200?random=10" alt=""></div>
    <div class="nome">Caderno</div>
    <div class="preco">$3</div>
  </div>

  <div class="cartao">
    <div class="imagem"><img src="https://picsum.photos/300/200?random=11" alt=""></div>
    <div class="nome">Caneta</div>
    <div class="preco">$5</div>
  </div>

  <div class="cartao">
    <div class="imagem"><img src="https://picsum.photos/300/200?random=12" alt=""></div>
    <div class="nome">Mochila</div>
    <div class="preco">$7</div>
  </div>

  <div class="cartao">
    <div class="imagem"><img src="https://picsum.photos/300/200?random=13" alt=""></div>
    <div class="nome">Garrafa</div>
    <div class="preco">$9</div>
  </div>
</div>

</body>
</html>
