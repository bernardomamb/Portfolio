<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }

  .navbar {
    background: white;
    border: 1px solid #e5e5e5;
    border-radius: 14px;
    padding: 12px 16px;
    
    display: flex;
    justify-content: space-between; /* 1º na esquerda, último na direita */
    align-items: center; /* alinha tudo no meio vertical */
  }

  .logo { font-weight: bold; font-size: 18px; }

  .links {
    display: flex;
    gap: 20px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .links a {
    text-decoration: none;
    color: #777;
    font-size: 15px;
  }
  .links a:hover { color: #111; }

  .btn-entrar {
    background: #111;
    color: white;
    border: none;
    padding: 8px 18px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">Estúdio</div>

  <ul class="links">
    <li><a href="#">Início</a></li>
    <li><a href="#">Cursos</a></li>
    <li><a href="#">Blog</a></li>
    <li><a href="#">Contacto</a></li>
  </ul>

  <button class="btn-entrar">Entrar</button>
</nav>

</body>
</html>
