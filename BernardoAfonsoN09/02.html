<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
  
  .galeria {
    display: grid;
    grid-template-columns: 1fr 1fr; /* 2 colunas */
    gap: 12px;
    max-width: 600px;
  }

  .foto {
    border-radius: 12px;
    overflow: hidden; /* pra imagem não sair da borda redonda */
    background: #ddd;
  }

  /* A imagem em si - isso é o mais importante */
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* corta a imagem pra preencher sem esticar */
    display: block;
  }

  /* Foto 1 ocupa as 2 colunas inteiras */
  .foto1 {
    grid-column: span 2;
    height: 280px;
  }

  /* Foto 2 e 3 dividem a linha */
  .foto2 { height: 160px; }
  .foto3 { height: 250px; } /* mais alta, que nem no teu print */
</style>
</head>
<body>

<h2>Galeria em mosaico</h2>

<div class="galeria">
  <div class="foto foto1">
    <img src="C:\Users\HP\Documents\Html\mamb\html\imagens\cetadireita2.jpeg">
  </div>
  <div class="foto foto2">
    <img src="C:\Users\HP\Documents\Html\mamb\html\imagens\musica2.jpeg">
  </div>
  <div class="foto foto3">
    <img src="C:\Users\HP\Documents\Html\mamb\html\imagens\jogo4.jpeg">
  </div>
</div>

</body>
</html>
